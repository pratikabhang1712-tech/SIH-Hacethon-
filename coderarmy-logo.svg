<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ca-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#F1F5F9" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <linearGradient id="ca-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#00A3FF" />
    </linearGradient>
    <filter id="ca-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="#000000" rx="40" />

  <!-- Monogram CA -->
  <g transform="translate(0, -20)">
    <!-- Letter C -->
    <!-- Outer arc from near apex around left to bottom right -->
    <path
      d="M 270 95
         C 255 95 240 98 225 105
         C 195 95 160 105 132 135
         C 95 175 95 245 132 285
         C 165 320 215 325 255 305
         L 242 272
         C 215 285 180 280 155 255
         C 130 228 130 192 155 165
         C 178 140 210 135 240 148
         L 270 95 Z"
      fill="url(#ca-silver)"
    />

    <!-- Code Brackets < / > inside C -->
    <!-- < -->
    <path
      d="M 175 190 L 150 210 L 175 230"
      fill="none"
      stroke="url(#ca-cyan)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- / -->
    <path
      d="M 197 180 L 183 240"
      fill="none"
      stroke="url(#ca-cyan)"
      stroke-width="10"
      stroke-linecap="round"
    />
    <!-- > -->
    <path
      d="M 205 190 L 230 210 L 205 230"
      fill="none"
      stroke="url(#ca-cyan)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter A -->
    <!-- Stylized triangular A with military peak and chevrons inside -->
    <path
      d="M 285 85
         L 235 295
         L 270 295
         L 282 245
         L 328 245
         L 340 295
         L 375 295
         L 325 85
         Z
         M 305 135
         L 320 215
         L 290 215
         Z"
      fill="url(#ca-silver)"
      fill-rule="evenodd"
    />

    <!-- Star inside A -->
    <polygon
      points="305,145 308,154 317,154 310,160 312,169 305,163 298,169 300,160 293,154 302,154"
      fill="#FFFFFF"
    />

    <!-- Military Chevrons (Rank Stripes) inside A -->
    <!-- Chevron 1 (Upper) -->
    <path
      d="M 292 182 L 305 195 L 318 182"
      fill="none"
      stroke="url(#ca-cyan)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Chevron 2 (Lower) -->
    <path
      d="M 292 204 L 305 217 L 318 204"
      fill="none"
      stroke="url(#ca-cyan)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography -->
  <!-- CODER -->
  <text
    x="250"
    y="360"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="52"
    letter-spacing="6"
    fill="url(#ca-silver)"
  >
    CODER
  </text>

  <!-- — ARMY — -->
  <g transform="translate(0, 405)">
    <!-- Left Dash -->
    <line x1="120" y1="-12" x2="165" y2="-12" stroke="url(#ca-cyan)" stroke-width="6" stroke-linecap="round" />
    <!-- ARMY Text -->
    <text
      x="250"
      y="0"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
      font-weight="900"
      font-size="38"
      letter-spacing="10"
      fill="url(#ca-cyan)"
    >
      ARMY
    </text>
    <!-- Right Dash -->
    <line x1="335" y1="-12" x2="380" y2="-12" stroke="url(#ca-cyan)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- CODE • BUILD • IMPACT -->
  <text
    x="250"
    y="445"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-weight="700"
    font-size="14"
    letter-spacing="8"
    fill="#E2E8F0"
  >
    CODE  •  BUILD  •  IMPACT
  </text>
</svg>
