<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ca-ico-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#F1F5F9" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <linearGradient id="ca-ico-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#00A3FF" />
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="300" height="300" rx="60" fill="#0A0F1D" />

  <g transform="translate(10, 15)">
    <!-- Letter C -->
    <path
      d="M 185 45
         C 170 45 155 48 140 55
         C 112 45 80 55 55 85
         C 20 125 20 190 55 228
         C 86 260 132 265 170 245
         L 158 214
         C 132 226 100 220 76 198
         C 52 172 52 138 76 112
         C 97 89 127 84 155 97
         L 185 45 Z"
      fill="url(#ca-ico-silver)"
    />

    <!-- Code Brackets < / > inside C -->
    <path
      d="M 94 138 L 72 156 L 94 174"
      fill="none"
      stroke="url(#ca-ico-cyan)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 112 128 L 100 184"
      fill="none"
      stroke="url(#ca-ico-cyan)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path
      d="M 120 138 L 142 156 L 120 174"
      fill="none"
      stroke="url(#ca-ico-cyan)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter A -->
    <path
      d="M 198 35
         L 152 235
         L 185 235
         L 196 188
         L 238 188
         L 249 235
         L 282 235
         L 236 35
         Z
         M 217 82
         L 231 160
         L 203 160
         Z"
      fill="url(#ca-ico-silver)"
      fill-rule="evenodd"
    />

    <!-- Star inside A -->
    <polygon
      points="217,92 220,100 229,100 222,106 224,115 217,109 210,115 212,106 205,100 214,100"
      fill="#FFFFFF"
    />

    <!-- Military Chevrons (Rank Stripes) inside A -->
    <!-- Chevron 1 -->
    <path
      d="M 205 128 L 217 140 L 229 128"
      fill="none"
      stroke="url(#ca-ico-cyan)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Chevron 2 -->
    <path
      d="M 205 148 L 217 160 L 229 148"
      fill="none"
      stroke="url(#ca-ico-cyan)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
